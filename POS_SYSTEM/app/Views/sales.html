  <script>
    // Minimal, robust cart logic — keeps your layout intact
    const CART_KEY = 'pos_cart_v1';
    let cart = JSON.parse(sessionStorage.getItem(CART_KEY) || '[]');

    function fmt(n){ return Number(n).toFixed(2); }

    function renderCart(){
      const tbody = document.getElementById('cart-body');
      tbody.innerHTML = '';
      let total = 0;

      if(cart.length === 0){
        const tr = document.createElement('tr');
        tr.innerHTML = '<td colspan="5" style="text-align:center; color:#666;">Cart is empty</td>';
        tbody.appendChild(tr);
      } else {
        cart.forEach((item, idx) => {
          total += item.price * item.qty;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${escapeHtml(item.category)}</td>
            <td>${escapeHtml(item.name)}</td>
            <td>K${fmt(item.price)}</td>
            <td>
              <div style="display:flex; align-items:center; gap:6px;">
                <button data-idx="${idx}" class="qty-btn" data-delta="1">+</button>
                <span>${item.qty}</span>
                <button data-idx="${idx}" class="qty-btn" data-delta="-1">-</button>
              </div>
            </td>
            <td class="cart-actions">
              <button data-idx="${idx}" class="remove">Remove</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('cart-total').innerText = 'Total: K' + fmt(total);
      sessionStorage.setItem(CART_KEY, JSON.stringify(cart));
      attachCartListeners();
    }

    function addToCart(product){
      const existing = cart.find(p => p.name === product.name);
      if(existing) existing.qty++;
      else cart.push({...product, qty:1});
      renderCart();
    }

    function changeQty(index, delta){
      if(!cart[index]) return;
      cart[index].qty += delta;
      if(cart[index].qty <= 0) cart.splice(index,1);
      renderCart();
    }

    function removeItem(index){
      cart.splice(index,1);
      renderCart();
    }

    function attachCartListeners(){
      document.querySelectorAll('#cart-body .qty-btn').forEach(btn => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.idx);
          const delta = Number(btn.dataset.delta);
          changeQty(idx, delta);
        };
      });
      document.querySelectorAll('#cart-body .remove').forEach(btn => {
        btn.onclick = () => removeItem(Number(btn.dataset.idx));
      });
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // Wire product cards
    document.querySelectorAll('.box').forEach(card => {
      const btn = card.querySelector('.add-to-cart');
      btn.addEventListener('click', () => {
        const product = {
          name: card.dataset.name,
          category: card.dataset.category,
          price: parseFloat(card.dataset.price),
          stock: parseInt(card.dataset.stock || '0', 10)
        };
        addToCart(product);
      });
    });

    // Clear and checkout
    document.getElementById('clear-cart').addEventListener('click', () => { cart = []; renderCart(); });
    document.getElementById('checkout').addEventListener('click', () => {
      if(cart.length === 0){ alert('Cart is empty'); return; }
      // placeholder: send cart to backend here
      alert('Checkout: ' + cart.length + ' item(s). Total ' + document.getElementById('cart-total').innerText);
      cart = []; renderCart();
    });

    // Search (client-side filter)
    document.getElementById('search-form').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      document.querySelectorAll('#product-grid .box').forEach(box => {
        const name = box.dataset.name.toLowerCase();
        const cat = box.dataset.category.toLowerCase();
        box.style.display = (name.includes(q) || cat.includes(q) || q === '') ? '' : 'none';
      });
    });

    // Init
    document.getElementById('today').innerText = new Date().toLocaleDateString(undefined, { day:'numeric', month:'long', year:'numeric' });
    renderCart();
  </script>
